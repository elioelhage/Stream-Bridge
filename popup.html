<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stream Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Stream Bridge</h1>
        <p id="status">Loading…</p>
      </div>
      <label class="switch" aria-label="Enable Stream Bridge">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <label>
      <span>Twitch streamer</span>
      <input id="twitchChannel" type="text" placeholder="xqc">
    </label>

    <label>
      <span>YouTube live video URL</span>
      <input id="youtubeVideoUrl" type="url" placeholder="https://www.youtube.com/watch?v=…">
    </label>

    <label class="checkbox-row">
      <input id="closeBackupAfterReturn" type="checkbox">
      <span>Close backup tab after the ad</span>
    </label>

    <div class="actions">
      <button id="prepare">Prepare backup</button>
      <button id="save" class="primary">Save</button>
    </div>

    <section class="test-panel">
      <div class="test-heading">
        <strong>Test mode</strong>
        <span id="testState">Idle</span>
      </div>
      <p>Test the exact switch/return path without waiting for a Twitch ad.</p>
      <div class="actions">
        <button id="simulateStart">Simulate ad</button>
        <button id="simulateEnd">Return to Twitch</button>
      </div>
    </section>

    <p class="note">v0.3 uses your exact YouTube live-video URL. It does not construct a channel /live URL or alter Twitch playback.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
