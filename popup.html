<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stream Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Stream Bridge</h1>
        <p id="status">Loading…</p>
      </div>
    </header>

    <label>
      <span>Twitch streamer</span>
      <input id="twitchChannel" type="text" placeholder="Open a Twitch stream" readonly>
    </label>

    <label>
      <span>YouTube live stream</span>
      <input id="youtubeVideoUrl" type="url" placeholder="https://www.youtube.com/watch?v=…">
    </label>

    <div class="actions">
      <button id="save" class="primary">Save</button>
    </div>

    <section class="test-panel">
      <strong>Test</strong>
      <p>Simulates a 12-second ad. The YouTube stream opens in a separate tab and closes automatically when the test ends.</p>
      <div class="actions">
        <button id="simulateStart">Simulate ad</button>
      </div>
    </section>

    <p class="note">The Twitch tab stays open while the temporary YouTube tab is used during the ad.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
