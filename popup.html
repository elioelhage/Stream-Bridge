<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stream Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">↗</div>
        <div>
          <h1>Stream Bridge</h1>
          <p id="status">Loading…</p>
        </div>
      </div>
      <span class="version-pill">v1.1</span>
    </header>

    <section class="stream-section">
      <div class="section-heading">
        <span class="section-kicker">TWITCH</span>
        <span class="section-status">SOURCE</span>
      </div>
      <div class="stream-field readonly-field">
        <span class="field-icon twitch-icon" aria-hidden="true">T</span>
        <input id="twitchChannel" type="text" placeholder="No Twitch stream detected" readonly>
      </div>
    </section>

    <section class="stream-section">
      <div class="section-heading">
        <span class="section-kicker">YOUTUBE</span>
        <span class="section-status">BACKUP VIDEO</span>
      </div>
      <div class="stream-field">
        <span class="field-icon youtube-icon" aria-hidden="true">▶</span>
        <input id="youtubeVideoUrl" type="url" placeholder="Paste any YouTube video or live link">
      </div>
      <p class="helper-text">Any YouTube video works. Live videos return to the live portion; regular videos resume where you left off.</p>
    </section>

    <button id="save" class="primary">Save backup video</button>

    <footer>
      <span>Stream Bridge</span>
      <span>v1.1</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
