<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StreamSwitch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>StreamSwitch</h1>
        <p id="status">Loading…</p>
      </div>
      <label class="switch" aria-label="Enable StreamSwitch">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <label>
      <span>Twitch streamer</span>
      <input id="twitchChannel" type="text" placeholder="xqc">
    </label>

    <label>
      <span>YouTube handle <em>(defaults to Twitch name)</em></span>
      <input id="youtubeChannel" type="text" placeholder="@xqc">
    </label>

    <label class="checkbox-row">
      <input id="closeBackupAfterReturn" type="checkbox">
      <span>Close backup tab after the ad</span>
    </label>

    <div class="actions">
      <button id="prepare">Prepare backup</button>
      <button id="save" class="primary">Save</button>
    </div>

    <section class="test-panel">
      <div class="test-heading">
        <strong>Test mode</strong>
        <span id="testState">Idle</span>
      </div>
      <p>Use this to test switching without waiting for a real Twitch ad.</p>
      <div class="actions">
        <button id="simulateStart">Simulate ad</button>
        <button id="simulateEnd">Return to Twitch</button>
      </div>
    </section>

    <p class="note">v0.2 observes Twitch's player state and switches tabs. Test mode uses the same switching path as a real ad signal.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
